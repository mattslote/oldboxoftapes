<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="preconnect" href="https://fonts.googleapis.com">

<body class="page-contact">
  <header class="site-header">
    <nav><a href="contact.html">contact</a></nav>
    <a class="brand" href="/">Old Box of Tapes</a>
    <span></span>
  </header>

  <main class="contact">
    <div>
      <h2>Get the ball rolling.</h2>
      <p>We typically get back within a day</p>
    </div>

    <!-- TODO: set action to your form handler (Formspree, Web3Forms, etc.).
         Field list is a guess: the Squarespace export did not include the original form's fields. -->
    <form action="FORM_ENDPOINT_HERE" method="POST">
      <label>Name <input type="text" name="name" required autocomplete="name"></label>
      <label>Email <input type="email" name="email" required autocomplete="email"></label>
      <label>Message <textarea name="message" required></textarea></label>
      <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="pill" type="submit">Send</button>
    </form>
  </main>

  <footer class="site-footer">
    <ul><li><a href="contact.html">Get in Touch</a></li></ul>
    <p class="copy">© Old Box of Tapes</p>
  </footer>
</body>
